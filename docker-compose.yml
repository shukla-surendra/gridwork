# Full local stack: postgres + redis + backend (FastAPI) + frontend (React, built + served by nginx).
# Same shape this will later take in AKS (Postgres as a StatefulSet, backend/frontend as Deployments) —
# this is the local rehearsal before that move.
services:
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=productify
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Azure Storage emulator -- speaks the real Blob AND Queue REST APIs, so
  # the backend's azure-storage-blob/azure-storage-queue SDK code
  # (adapters/blob, adapters/queue) runs unmodified against this locally
  # and against a real Storage Account in AKS (terraform/keyvault).
  # "azurite" (not "azurite-blob") starts all three services; only
  # blob (10000) and queue (10001) are used here -- table (10002) isn't.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
    networks:
      - app-network

  backend:
    build: ./assistant_backend
    ports:
      - "8000:8000"
    volumes:
      - ./assistant_backend:/app
    environment:
      - ENVIRONMENT=dev
      - STORAGE_TYPE=postgresql
      - AUTH_TYPE=jwt
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=productify
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://10.1.196.56:3000
      # Azurite's fixed, publicly-documented well-known dev account/key --
      # not a real secret, same one every Azurite install ships with.
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      - AZURE_STORAGE_CONTAINER=avatars
      # Same connection string above already carries a QueueEndpoint, so
      # AzureQueueStorage picks it up automatically -- these two just name
      # which queues to use, matching the Terraform-created queue names.
      - AZURE_STORAGE_QUEUE_NAME=backend-jobs
      - AZURE_STORAGE_QUEUE_POISON_NAME=backend-jobs-poison
      # Browser-facing -- the container above uses the internal docker-network
      # hostname "azurite", which the browser can't resolve; this is the
      # host-published port instead, same split as BACKEND_HOST in nginx.
      - AZURE_STORAGE_PUBLIC_BASE_URL=http://localhost:10000/devstoreaccount1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      azurite:
        condition: service_started
    networks:
      - app-network

  # Next.js (Pages Router, static export) -- replaced the old Create React
  # App frontend. That app's source is kept at ../archive/assistant_web for
  # reference during the cutover period; it's no longer built here.
  frontend:
    build: ./assistant_web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  # Pinned to the pre-rename name so the folder rename (personal_assistant
  # -> gridwork) doesn't change Compose's default project-name-derived
  # volume name and silently start a fresh, empty database.
  postgres_data:
    name: personal_assistant_postgres_data
