# Defaults are tuned for a local minikube run: images are built locally and
# loaded into minikube's node with `minikube image load` (see README.md),
# so pullPolicy defaults to Never -- flip to IfNotPresent/Always once these
# images are pushed to a real registry (ECR/ACR/GHCR/...).

backend:
  image:
    repository: personal-assistant-backend
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  port: 8000
  # Set (via Terraform's application stage, from the keyvault stage's
  # backend_identity_client_id output) to source OPENAI_API_KEY from Azure
  # Key Vault through the Secrets Store CSI Driver instead of
  # secrets.openaiApiKey below. Empty (the default, e.g. on minikube where
  # there's no Key Vault at all) keeps the old direct-Secret path.
  workloadIdentityClientId: ""
  env:
    # NOT "production" -- config.py has a startup check that hard-requires
    # SECRET_KEY (unused anywhere else in the codebase -- grepped, nothing
    # reads settings.SECRET_KEY) and OPENAI_API_KEY (deliberately optional:
    # chat_handler.py returns a clean 503 without one, by design) whenever
    # ENVIRONMENT=="production". Flipping this to "production" honestly
    # needs that check fixed first, not a fake SECRET_KEY value that
    # wouldn't actually secure anything.
    environment: development
    storageType: postgresql
    authType: jwt
    allowedOrigins: "*"  # browser only ever talks to the frontend's own origin now
                         # (nginx proxies /api/ server-side) -- this barely matters,
                         # kept configurable rather than hardcoded.
    openaiModel: gpt-3.5-turbo
    # Set (via Terraform's application stage, from the keyvault stage's
    # storage_account_blob_endpoint output) to enable avatar uploads. Not
    # secret -- a public HTTPS endpoint; the backend authenticates to it via
    # the same Workload Identity as Key Vault above (Storage Blob Data
    # Contributor role, terraform/keyvault). Empty (e.g. minikube, no
    # storage account) just means the avatar endpoint isn't usable there.
    azureStorageAccountUrl: ""
    azureStorageContainer: "avatars"
    # Set (via Terraform's application stage, from the keyvault stage's
    # storage_account_queue_endpoint output) to enable the KEDA scaling
    # test's job queue. Same non-secret/Workload-Identity pattern as the
    # blob URL above. Empty means the queue producer/consumer endpoints
    # are unusable (e.g. minikube) -- nothing else in the app depends on it.
    azureStorageQueueUrl: ""
    # Set (via Terraform's application stage) to the shared, cluster-wide
    # OTel Collector's OTLP HTTP endpoint (terraform/observability) --
    # not this app's own resource, same "infra side, not app side" shape
    # as everything else in that stage. Empty disables instrumentation
    # entirely (see assistant_backend/observability.py's graceful-absence
    # check), e.g. on minikube where there's no observability stack at all.
    otelExporterOtlpEndpoint: ""

# Only used when keda.enabled is true -- KEDA's azure-queue scaler trigger
# needs the bare account name (not a URL) plus which queue to watch.
queue:
  accountName: ""
  name: "backend-jobs"
  poisonName: "backend-jobs-poison"

# Off by default (e.g. minikube, or before terraform/application's
# helm_release.keda has installed KEDA's CRDs) -- turning this on renders
# templates/scaledobject.yaml + templates/triggerauthentication.yaml,
# which the API server will reject if the ScaledObject/TriggerAuthentication
# CRDs don't exist yet.
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 5
  # KEDA target: desired replicas = ceil(queue length / queueLength). At 5,
  # 12 queued messages -> 3 replicas (capped at maxReplicaCount).
  queueLength: 5
  pollingInterval: 10   # seconds between KEDA checking queue length
  cooldownPeriod: 60    # seconds queue must stay empty before scaling back to minReplicaCount

frontend:
  # false when assistant_web is served from Azure Storage static website +
  # Front Door instead (terraform/frontend-cdn) -- the ingress then exposes
  # only the backend, under /api (see templates/ingress.yaml), which is
  # exactly the origin Front Door's /api/* route points at. true by default
  # so the minikube flow in this chart's README (frontend + backend both in
  # one cluster, no Front Door involved) is unaffected.
  enabled: true
  image:
    repository: personal-assistant-frontend
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  port: 80

postgres:
  image: postgres:15
  database: productify
  user: postgres
  storage: 1Gi

redis:
  image: redis:7

# Secrets -- these are dev/demo defaults so the chart installs out of the box.
# Override for anything beyond local minikube experimentation, e.g.:
#   helm upgrade --install personal-assistant ./helm/personal-assistant \
#     --set secrets.openaiApiKey=$OPENAI_API_KEY \
#     --set secrets.postgresPassword=$(openssl rand -hex 16) \
#     --set secrets.jwtSecret=$(openssl rand -hex 32)
# or pass -f values-secret.yaml (gitignored) with the same keys.
secrets:
  postgresPassword: postgres
  jwtSecret: dev-only-change-me
  # Ignored once backend.workloadIdentityClientId is set (see above) --
  # OPENAI_API_KEY then comes from Key Vault instead. Empty -> chat's
  # /completion endpoint returns a clean 503, either way.
  openaiApiKey: ""

# Only used when backend.workloadIdentityClientId is set.
keyVault:
  name: ""
  tenantId: ""

ingress:
  enabled: false
  className: nginx
  # Empty = no host match, so the Ingress serves any Host header -- avoids
  # needing to already know the Load Balancer's public IP (to build a
  # nip.io-style hostname) before the LB exists in the first place. Set a
  # real hostname once you have a domain pointed at the IP.
  host: ""
  rateLimit:
    enabled: true
    requestsPerSecond: 10
    burstMultiplier: 5
  # false until `host` is actually set (chicken-and-egg: the LB's public IP,
  # and therefore any nip.io-style hostname built from it, isn't known until
  # after ingress-nginx's Service already exists -- same reason `host`
  # itself defaults empty). When true, cert-manager (installed as its own
  # helm_release, terraform/application/main.tf) watches this Ingress via
  # its annotation below and provisions a real Let's Encrypt cert with no
  # custom domain required -- a browser calling this origin from an HTTPS
  # page (e.g. assistant_web on its Storage static website) would otherwise
  # be hard-blocked as mixed content, not just warned.
  tls:
    enabled: false
    secretName: personal-assistant-tls
    clusterIssuer: letsencrypt-prod
